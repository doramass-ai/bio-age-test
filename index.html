<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Тест: ваш биологический возраст</title>
  <meta name="description" content="Узнайте свой биологический возраст за 2 минуты по 9 показателям здоровья. На основе модели Healthspan Copilot (NUS).">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar" hidden>
      <button class="back-btn" id="backBtn" aria-label="Назад">←</button>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="step-counter" id="stepCounter"></span>
    </header>
    <main class="stage" id="stage"></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
